name: TaskFlow

# `edited` matters as much as `opened`: the usual fix for a red run here is to
# edit the PR body, and without this the check would never re-run to see it.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  taskflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Uses the runner's preinstalled Node; the script has no dependencies.
      - name: Task link
        env:
          TASKFLOW_API_URL: ${{ vars.TASKFLOW_API_URL }}
          TASKFLOW_API_TOKEN: ${{ secrets.TASKFLOW_API_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.head_ref }}
        run: node .github/scripts/taskflow-link.mjs
